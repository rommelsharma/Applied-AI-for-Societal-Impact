services:
  tts-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: tts-agent:latest
    ports:
      - "8000:8000"
    volumes:
      - ../models:/app/models
      - ../voice_samples:/app/voice_samples
      - ../outputs:/app/outputs
    env_file:
      - ../.env
    environment:
      - PYTHONPATH=/app
    # GPU access — requires NVIDIA Container Toolkit
    # Remove the 'deploy' block to run CPU-only
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
