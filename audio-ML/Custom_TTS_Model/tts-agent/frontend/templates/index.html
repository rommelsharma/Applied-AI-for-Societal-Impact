<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TTS Agent</title>
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>TTS Agent</h1>
      <p class="subtitle">High-quality speech synthesis · Kokoro-82M &amp; F5-TTS</p>
      <span id="device-badge" class="badge">checking device…</span>
    </header>

    <main>
      <!-- Mode selector -->
      <div class="mode-tabs">
        <button class="tab active" data-mode="builtin">Built-in Voices</button>
        <button class="tab" data-mode="clone">Voice Cloning</button>
      </div>

      <!-- Built-in voices panel -->
      <section id="panel-builtin" class="panel active">
        <div class="field">
          <label for="voice-select">Voice</label>
          <select id="voice-select">
            <option value="">Loading voices…</option>
          </select>
        </div>
      </section>

      <!-- Voice cloning panel -->
      <section id="panel-clone" class="panel">
        <div class="field">
          <label for="sample-select">Reference clip</label>
          <select id="sample-select">
            <option value="">— select uploaded sample —</option>
          </select>
        </div>
        <div class="field">
          <label for="ref-text">Reference transcript <span class="hint">(optional but improves quality)</span></label>
          <input type="text" id="ref-text" placeholder="What is said in the reference clip…" />
        </div>
        <div class="field upload-area">
          <label>Upload new reference clip</label>
          <input type="file" id="upload-file" accept=".wav,.mp3,.flac,.ogg" />
          <button id="upload-btn" class="btn-secondary">Upload</button>
          <span id="upload-status"></span>
        </div>
      </section>

      <!-- Shared controls -->
      <div class="field field-row input-format-row">
        <div>
          <label for="input-format">Input format</label>
          <select id="input-format">
            <option value="plain">Plain Text</option>
            <option value="ssml">SSML Markup</option>
          </select>
        </div>
        <button id="ssml-example-btn" class="btn-ghost hidden" type="button">
          Insert example
        </button>
      </div>

      <div id="ssml-hint" class="ssml-hint hidden">
        <strong>Supported SSML tags:</strong>
        <code>&lt;pause ms="500"/&gt;</code>
        &nbsp;·&nbsp;
        <code>&lt;break strength="paragraph"/&gt;</code>
        &nbsp;·&nbsp;
        <code>&lt;emphasis level="strong"&gt;…&lt;/emphasis&gt;</code>
        &nbsp;·&nbsp;
        <code>&lt;say-as interpret-as="characters"&gt;NASA&lt;/say-as&gt;</code>
      </div>

      <div class="field">
        <label for="text-input">Text to synthesize</label>
        <textarea id="text-input" rows="6" maxlength="5000"
          placeholder="Enter the text you want to convert to speech…"></textarea>
        <span id="char-count">0 / 5000</span>
      </div>

      <div class="field field-row">
        <div>
          <label for="speed-slider">Speed: <span id="speed-val">1.0×</span></label>
          <input type="range" id="speed-slider" min="0.5" max="2.0" step="0.1" value="1.0" />
        </div>
      </div>

      <button id="synthesize-btn" class="btn-primary" disabled>Generate Speech</button>

      <!-- Output -->
      <div id="output-section" class="hidden">
        <h2>Output</h2>
        <audio id="audio-player" controls></audio>
        <div class="output-meta">
          <span id="duration-label"></span>
          <span id="engine-label"></span>
        </div>
        <a id="download-link" class="btn-secondary" download>Download WAV</a>
      </div>

      <div id="error-box" class="error hidden"></div>
      <div id="loading" class="spinner hidden"></div>
    </main>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
