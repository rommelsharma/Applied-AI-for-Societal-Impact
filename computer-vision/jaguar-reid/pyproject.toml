[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jaguar-reid"
version = "1.0.0"
description = "Jaguar re-identification — MegaDescriptor, metric learning, and retrieval post-processing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "See repository / competition terms" }
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "timm>=1.0.0",
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "Pillow>=10.0",
  "tqdm>=4.66",
  "huggingface_hub>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
